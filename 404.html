<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Netlify serves this automatically for any URL that does not exist -
       it just has to be called 404.html and sit in the site root. -->
  <title>Page not found - Wedlocked In</title>
  <meta name="robots" content="noindex">

  <link rel="icon" type="image/png" href="images/mark.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <!-- Same fonts link as index.html and privacy.html - change all three together -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <a class="skip-link" href="#main">Skip to content</a>

  <main id="main">
    <section class="section error-section">
      <div class="section-inner error-inner">
        <p class="eyebrow">404</p>
        <h1>AITA for breaking this link?</h1>
        <p>Whatever was here has moved, or the URL had a typo in it. The show is still very much on.</p>
        <p><a class="btn-primary" href="index.html"><i class="fa-solid fa-play" aria-hidden="true"></i> Back to the show</a></p>
      </div>
    </section>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
